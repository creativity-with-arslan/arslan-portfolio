<section id="projects" class="a1-section"><div class="a1-container">
  <div class="section-head"><div><span class="a1-kicker">04 — Selected work</span><div class="section-num">WORK</div></div><div><h2 appReveal class="section-heading">Built, studied,<br><em>and shipped.</em></h2><p class="a1-copy" style="max-width:620px">A mix of university projects, independent builds and real-world application exposure.</p></div></div>
  <div class="project-list"><article *ngFor="let project of projects; let i=index" appReveal class="project"><div><span class="project-index">0{{ i+1 }}</span><span class="project-tag">{{ project.tag }}</span></div><div><h3 class="project-title">{{ project.title }}</h3><p class="a1-copy project-desc">{{ project.description }}</p><div class="project-tech"><span *ngFor="let t of project.tech" class="skill-pill">{{ t }}</span></div><div class="project-links"><a *ngFor="let link of project.links" [href]="link.url">{{ link.label }} ↗</a></div></div><div class="project-feature">{{ project.feature }}</div></article></div>
</div></section>
