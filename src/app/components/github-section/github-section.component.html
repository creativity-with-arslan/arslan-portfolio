<section id="github" class="a1-section"><div class="a1-container"><div class="section-head"><div><span class="a1-kicker">08 — Development</span><div class="section-num">CODE</div></div><div><div style="display:flex;justify-content:space-between;align-items:end;gap:20px"><h2 appReveal class="section-heading" style="margin-bottom:0">The work is<br><em>still in progress.</em></h2><a [href]="githubUrl" target="_blank" rel="noopener noreferrer" class="a1-btn a1-btn-ghost">GitHub ↗</a></div></div></div>
<div class="github-grid"><a *ngFor="let tile of tiles" [href]="tile.link" appReveal class="github-card"><span class="github-icon">{{ tile.icon }}</span><div><h3 class="github-title">{{ tile.title }}</h3><span class="github-sub">{{ tile.subtitle }}</span></div></a></div></div></section>
